# 추천 모델 주간 자동 재학습
# 매주 월요일 03:00(한국시간) 구글시트 관리대장을 내려받아 model.json을 다시 만들고 사이트에 반영합니다.
# Actions 탭 → "추천모델 주간 재학습" → [Run workflow] 로 지금 바로 돌릴 수도 있어요.
name: 추천모델 주간 재학습

on:
  schedule:
    - cron: '0 18 * * 0'      # UTC 일요일 18:00 = 한국 월요일 03:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  SHEET_ID: 1hWRxLYkJfPEBfItSNKv7IFuSOFcLI35b9jCHnKVRBtE

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install pandas openpyxl scikit-learn

      - name: 구글시트로 재학습
        run: python tools/train_model.py "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx" model.json

      - name: 바뀐 모델 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json model_report.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "추천모델 자동 재학습 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
            echo "PUSHED=1" >> $GITHUB_ENV
          fi

      - name: 사이트 다시 배포
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "자동 배포 요청 생략 (커밋으로 배포됨)"
