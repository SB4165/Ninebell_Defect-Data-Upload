<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>부적합 양식 변환기</title>
<style>
:root{
  --empty:#fbdcd7; --bg:#ffffff; --bg2:#f6f8fa; --bd:#d0d7de; --bd2:#d8dee4; --fg:#1f2328; --mut:#59636e;
  --acc:#0969da; --acc-bg:#ddf4ff; --ok:#1a7f37; --ok-bg:#dafbe1; --btn:#1f883d; --btn-h:#1a7f37;
  --warn:#9a6700; --warn-bg:#fff8c5; --err:#d1242f; --err-bg:#ffebe9; --sh:0 1px 0 rgba(31,35,40,.04);
}
html{color-scheme:only light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif}
header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.logo svg{flex:none}
.status{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--bd);border-radius:2em;padding:0 8px;background:var(--bg)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)}
main{max-width:1080px;margin:0 auto;padding:16px}
.box{border:1px solid var(--bd);border-radius:6px;background:var(--bg);box-shadow:var(--sh);margin-bottom:16px}
.box-h{background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 12px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box-h h2{font-size:14px;margin:0;font-weight:600}
.box-b{padding:12px}
textarea,input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
#src{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:6px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--btn);border-color:rgba(31,35,40,.15);color:#fff}
.btn.pri:hover{background:var(--btn-h)}
.btn.sm{padding:2px 10px;font-size:12px}
.mut{color:var(--mut);font-size:12px}
.finder{width:auto;flex:1;min-width:140px;max-width:220px}
.card{border:1px solid var(--bd);border-radius:6px;margin-bottom:16px;background:var(--bg)}
.card .box-h{justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.form{padding:12px;border-right:1px solid var(--bd2)}
.f{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:6px}
.f label{font-size:12px;color:var(--mut);font-weight:600}
.cat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px 118px}
.chip{font-size:12px;border:1px solid var(--bd);border-radius:2em;padding:1px 10px;background:var(--bg2);cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--acc)} .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.chip b{font-weight:600}
.conf{font-size:11px;border-radius:2em;padding:0 8px;font-weight:600}
.conf.h{background:var(--ok-bg);color:var(--ok)} .conf.m{background:var(--warn-bg);color:var(--warn)} .conf.l{background:var(--err-bg);color:var(--err)}
.out{padding:12px;display:flex;flex-direction:column}
.out pre{margin:0;flex:1;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans KR",monospace}
.warn{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:4px 8px;margin:0 0 8px}
.combo{position:relative}
.dd{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:2px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;box-shadow:0 8px 24px rgba(66,74,83,.2);max-height:240px;overflow:auto;display:none}
.dd div{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.dd div small{color:var(--mut)}
.dd div:hover,.dd div.act{background:var(--acc-bg)}
.actsel{display:flex;flex-wrap:wrap;gap:6px}
.csel{color:#1f2328}
.csel option{color:#1f2328}
input.need,select.need{background:var(--empty);border-color:#e9bfb8;color:#1f2328}
.actsel.need{border:2px dashed #d1242f;border-radius:6px;padding:6px;background:#fff}
.actsel.need::after{content:'선택 필요';font-size:12px;color:#d1242f;align-self:center;margin-left:4px}
input.need::placeholder{color:#8a4a40}
.qty{display:flex;align-items:center;gap:6px}
.qty input{max-width:120px}
.qty span{color:var(--mut);font-size:13px;font-weight:600}
.ac{font:inherit;font-size:13px;border:1px solid transparent;border-radius:2em;padding:2px 12px;cursor:pointer;color:#1f2328}
.ac:hover{border-color:rgba(31,35,40,.4)}
.ac.on{border-color:#1f2328;font-weight:600;box-shadow:0 0 0 1px #1f2328 inset}
.ac.on::before{content:'✓ '}
/* 탭 */
.tabs{max-width:1080px;margin:0 auto;padding:12px 16px 0;display:flex;gap:4px;border-bottom:1px solid var(--bd)}
.tabs button{font:inherit;font-size:14px;font-weight:600;background:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;padding:8px 14px;color:var(--mut);cursor:pointer;margin-bottom:-1px}
.tabs button.on{background:var(--bg);border-color:var(--bd);color:var(--fg)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:2em;background:var(--acc-bg);color:var(--acc);font-size:11px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(31,35,40,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .mbox{background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 32px rgba(31,35,40,.25);width:100%;max-width:420px;padding:18px}
.modal .mbox.wide{max-width:760px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--mut)}
.modal .mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal .mbtn .btn{min-width:80px;padding:7px 16px}
/* 관리대장 탭 */
.lbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lbar input[type=date]{width:auto}
.btn.danger{color:var(--err);border-color:#f1aeb5}
.twrap{overflow-x:auto;border:1px solid var(--bd);border-radius:6px;background:var(--bg)}
table.led{border-collapse:collapse;font-size:12.5px;min-width:1500px;width:100%}
table.led th,table.led td{border-bottom:1px solid var(--bd2);padding:6px 8px;text-align:left;vertical-align:top;white-space:nowrap}
table.led th{background:var(--bg2);position:sticky;top:0;font-weight:600;color:var(--mut)}
table.led td.wrap{white-space:normal;min-width:180px;max-width:320px}
table.led tr.done td{color:var(--mut)}
.st{font-size:11px;font-weight:600;border-radius:2em;padding:1px 8px}
.st.wait{background:var(--warn-bg);color:var(--warn)} .st.done{background:var(--ok-bg);color:var(--ok)} .st.dirty{background:var(--acc-bg);color:var(--acc)}
.efrm{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;align-items:center}
.efrm label{font-size:12px;color:var(--mut);font-weight:600}
@media (max-width:760px){ .efrm{grid-template-columns:1fr} .tabs{padding:8px 8px 0} .tabs button{padding:8px 10px;font-size:13px} }
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:32px 12px}
/* 모바일 전용 하단 복사 버튼 */
.mcopy{display:none;width:100%;margin-top:10px;padding:10px;font-size:15px}
@media (max-width:760px){
  .mcopy{display:block}
  .toast{top:16px;bottom:auto}
  .grid{grid-template-columns:1fr}
  .form{border-right:0;border-bottom:1px solid var(--bd2)}
  .f{grid-template-columns:1fr;gap:2px}
  .chips{margin-left:0}
  .status{margin-left:0;width:100%}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688ZM7.5 7.75a.75.75 0 0 1 1.5 0v2.5a.75.75 0 0 1-1.5 0Zm.75 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>부적합 양식 변환기</div>
  <div class="status" id="status"></div>
</div></header>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="conv" class="on">부적합 양식 변환기</button>
  <button type="button" data-tab="ledger">부적합 관리대장 업로드<span class="badge" id="ledBadge" style="display:none"></span></button>
</nav>
<main id="tab-conv">
  <section class="box">
    <div class="box-h"><h2>메시지 붙여넣기</h2><span class="mut">순서·번호 상관없이 발주명 / 품번 / 불량내용 (여러 건은 빈 줄로 구분)</span></div>
    <div class="box-b">
      <textarea id="src" placeholder="&lt;입력예시&gt;&#10;1. 프로젝트명 : CC04-157&#10;2. 품번 : SE-100P44-3&#10;3. 수량 : 1 EA&#10;4. 불량내용 : 탭 누락&#10;5. 귀책 : 우신테크&#10;6. 요청자 : 곽승범&#10;&#10;※ 부적합처리방 문구 복사 붙여넣기 (순서 상관없음)"></textarea>
      <div class="row">
        <button class="btn pri" id="go">변환</button>
        <button class="btn" id="clear">지우기</button>
        <span class="mut" style="margin-left:auto">Ctrl+Enter로 변환</span>
      </div>
    </div>
  </section>
  <div class="row" id="allbar" style="display:none;margin:-4px 0 12px">
    <span class="mut" id="cnt"></span>
  </div>
  <div id="cards"></div>
</main>
<main id="tab-ledger" style="display:none">
  <section class="box">
    <div class="box-h"><h2>부적합 관리대장 업로드</h2><span class="mut" id="ledInfo">불러오는 중…</span>
      <button class="btn sm" id="ledRefresh" style="margin-left:auto">새로고침</button></div>
    <div class="box-b">
      <div class="lbar">
        <span class="mut">발생일</span>
        <input type="date" id="syncFrom"> <span class="mut">~</span> <input type="date" id="syncTo">
        <button class="btn pri sm" id="syncRange">조건부 동기화</button>
        <button class="btn pri sm" id="syncAll">일괄 동기화</button>
        <button class="btn sm danger" id="delSynced" style="margin-left:auto">동기화 완료건 일괄삭제</button>
      </div>
      <div class="twrap"><table class="led"><thead><tr>
        <th>No.</th><th>상태</th><th>발생일</th><th>발주 프로젝트명</th><th>TYPE / PO No.</th><th>품명</th><th>품번</th><th>수량</th><th>귀책업체</th>
        <th>대분류</th><th>중분류</th><th>소분류</th><th>구분</th><th>발견자</th><th>담당자(발행자)</th><th>불량내용</th><th>조치사항</th><th>비고</th><th>관리</th>
      </tr></thead><tbody id="ledBody"></tbody></table></div>
      <p class="mut" style="margin:8px 0 0">· 수정·삭제·동기화는 비밀번호가 필요해요 (한 번 입력하면 창을 닫을 때까지 유지) · 10초마다 자동 새로고침</p>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* ================== 설정 ================== */
const CONFIG = {
  SHEET_ID: '1hWRxLYkJfPEBfItSNKv7IFuSOFcLI35b9jCHnKVRBtE',
  // 시트 찾는 순서: ① 올해 연도 이름 → ② 시트 고유번호(gid, 이름을 바꿔도 유지됨) → ③ 작년 연도 이름
  //   내용(제목 줄)이 맞는지 확인한 뒤 사용하므로, 연도가 바뀌어 이름이 달라져도 자동으로 찾아감
  REF:   { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288',  range: 'AD1:AF3000' },  // 분류표(6.1) + 귀책(6.3)
  PROJ:  { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288',  range: 'L1:M5000', merge: true }, // 발주명(L) / TYPE(M), 올해+작년 합침
  PARTS: { gid: '1577658176', range: 'A1:Z40' },   // 품명/품번 시트: 위 40행에서 제목('품번'/'품명'/'발견자') 열을 찾은 뒤 그 열만 끝까지(행 수 제한 없이) 읽음
  LEDGER:{ names: y=>[`수입공정 부적합 (${y})`,`수입/공정 부적합 (${y})`,`수입공정 부적합(${y})`], gid: '638838738', range: 'K1:S20000', merge: true }, // 관리대장 이력
  MODEL_URL: 'model.json',
  UPPER: ['TAP','HOLE','BURR'],         // 대문자로 통일할 소분류
  BIG_COLORS: {                          // 발생기인 대분류별 색상 (구글시트 칩 색상)
    '제조불량':'#d5ecbf', '기구설계불량':'#e5d2f2', '전장설계불량':'#e5d2f2', '제어설계불량':'#e5d2f2',
    '업체불량':'#c7e1f7', '기타불량':'#e6e8eb'
  },
  BIG_ORDER: ['업체불량','제조불량','기구설계불량','전장설계불량','제어설계불량','기타불량'],   // 대분류 표시 순서
  WHEN: [['수입','#c7e1f7'], ['공정','#fde79a'], ['출하','#d5ecbf']],   // 발생시점 버튼
  EMPTY_COLOR: '#fbdcd7',                 // 비어 있는 칸 표시 색 (업체반출 색보다 30% 연하게)
  API_URL: 'https://script.google.com/macros/s/AKfycbwFnFwdLHLfrhgS1nkhN-d-N5eFV7PAMd97HaLlQaZzXlVqfCNCuvg5Ef5z01vQDoyb/exec',   // 관리대장 업로드용 Apps Script 웹앱 (부적합 관리대장 업로드 프로젝트)
  QUICK_NAMES: ['EFEM FRAME','PROCESS FRAME','BUFFER'],   // 품명 빠른 입력 (누르면 품번은 '-')
  VENDOR_ALIAS: { '브이피시스템':'VP시스템', '한국메카트로닉스':'한국메카' },   // 라벨·메시지 표기 → 귀책 목록 이름
  ACTIONS: [                              // 조치내용 드롭다운 (구글시트 칩 색상)
    ['방문조치','#fde79a'], ['업체반출','#f9cdc6'], ['자체처리','#d5ecbf'], ['정상진행','#c7e1f7'],
    ['재발주','#e5d2f2'], ['입고요청','#ec9a96'], ['현물수정','#e5d2f2'], ['폐기','#e6e8eb']
  ]
};
const MOCK = new URLSearchParams(location.search).has('mock');

/* ================== 유틸 ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s ?? '').replace(/\s+/g,' ').trim();
const key = s => clean(s).toUpperCase().replace(/\s+/g,'');
const fixSub = s => { const u = clean(s).replace(/\s+/g,''); return CONFIG.UPPER.includes(u.toUpperCase()) ? u.toUpperCase() : clean(s); };
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function today(){ const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choseong = s => [...String(s)].map(ch => { const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch; }).join('');

/* ================== 구글시트 읽기 (JSONP, 공개 링크) ================== */
let jsonpN = 0;
// 품명/품번 시트: ① 위쪽 몇 행에서 제목 열 위치 찾기 → ② 그 열만 행 수 제한 없이 끝까지 읽기
async function loadParts(){
  if (MOCK) { const r = await gviz(CONFIG.PARTS); return { parts:parseParts(r), finders:parseFinders(r), pubs:parsePubs(r) }; }
  const [head] = await loadSheet(CONFIG.PARTS, r=>r, r=>r.length>0);
  const isH = x => /^(품번|도번|part ?(no|number)|품명|item ?name|발견자|발행자.*)$/i.test(clean(x).replace(/\s/g,''));
  let cols = [];
  for (const r of head) { const c = r.map((x,j)=>isH(x)?j:-1).filter(j=>j>=0); if (c.length >= 2) { cols = c; break; } }
  if (!cols.length) cols = [0, 25];
  const L = j => String.fromCharCode(65 + j);
  const rows = await gviz({ gid: CONFIG.PARTS.gid, range: `${L(Math.min(...cols))}:${L(Math.max(...cols))}` });
  const parts = parseParts(rows);
  if (!parts.size) throw new Error('품번 없음');
  return { parts, finders: parseFinders(rows), pubs: parsePubs(rows) };
}
// 여러 후보 시트를 순서대로 시도 → 내용 검사(ok)를 통과한 결과만 사용
async function loadSheet(cfg, parse, ok){
  const Y = new Date().getFullYear(), seen = new Set(), cands = [];
  const add = c => { const k = c.sheet || 'gid:'+c.gid; if (!seen.has(k)) { seen.add(k); cands.push(c); } };
  (cfg.names ? cfg.names(Y) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  if (cfg.gid) add({ gid:cfg.gid, range:cfg.range });
  (cfg.names ? cfg.names(Y-1) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  const got = [], sigs = new Set();
  for (const c of cands) {
    try {
      const rows = MOCK ? await gviz(cfg) : await gviz(c);
      const sig = rows.length + '|' + JSON.stringify(rows.slice(0,8));   // 같은 시트를 이름·gid로 두 번 읽은 경우 제외
      if (sigs.has(sig)) continue;
      const x = parse(rows); if (!ok(x)) continue;
      sigs.add(sig); got.push(x);
      if (!cfg.merge || MOCK) break;
    } catch(e) {}
  }
  if (!got.length) throw new Error('시트를 찾지 못함');
  return got;
}
function gviz(src){
  if (MOCK) {
    const f = src===CONFIG.REF?'ref_AD_AF':src===CONFIG.PROJ?'proj_L_M':src===CONFIG.PARTS?'parts_C_D':null;
    return f ? fetch('mock/'+f+'.json').then(r=>r.json()) : Promise.reject(new Error('mock 없음'));
  }
  return new Promise((res, rej) => {
    const cb = '__gv' + (++jsonpN) + '_' + Date.now();
    const p = new URLSearchParams({ tqx:'out:json;responseHandler:'+cb, headers:'0', range: src.range });
    if (src.sheet) p.set('sheet', src.sheet); else if (src.gid) p.set('gid', src.gid);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(to); };
    const to = setTimeout(() => { done(); rej(new Error('시간 초과')); }, 20000);
    window[cb] = resp => { done();
      if (resp.status === 'error') return rej(new Error((resp.errors||[])[0]?.detailed_message || '시트 오류'));
      const rows = (resp.table?.rows || []).map(r => (r.c || []).map(c => c ? String(c.f ?? c.v ?? '') : ''));
      res(rows);
    };
    s.onerror = () => { done(); rej(new Error('불러오기 실패')); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?` + p.toString();
    document.head.appendChild(s);
  });
}

/* ================== 데이터 파싱 (제목 글자로 위치 찾기 → 행이 늘어나도 따라감) ================== */
const isTitle = s => /^\s*\d+(\.\d+)+\s/.test(s||'');   // "6.1 ...", "6.3 ..." 같은 구역 제목
function parseRef(rows){
  const cats = [], vendors = [];
  let mode = null, section = 0;
  for (const r of rows) {
    const [a='', b='', c=''] = r.map(clean);
    if (isTitle(a)) { mode = null; continue; }
    if (a==='대분류' && b==='중분류' && c==='소분류') { section++; mode = section===1 ? 'cat' : 'skip'; continue; } // 첫 분류표(6.1)만 사용, 6.2 제외
    if (a==='대분류' && b==='세부귀책') { mode = 'ven'; continue; }
    if (!a && !b && !c) continue;                    // 빈 줄 무시
    if (mode==='cat' && a && b && c) cats.push([a,b,fixSub(c)]);
    else if (mode==='ven' && a && b) vendors.push({ big:a, name:b });
  }
  const seen = new Set();
  return { cats: cats.filter(x=>{const k=x.join('>'); if(seen.has(k))return false; seen.add(k); return true;}), vendors };
}
function parseProj(rows){
  const out = []; let on = false;
  for (const r of rows) {
    const [a='', b=''] = r.map(clean);
    if (!on) { if (/발주명|PROJECT/i.test(a) && /^TYPE|타입/i.test(b)) on = true; continue; }
    if (a && b && !/발주명|PROJECT/i.test(a)) out.push({ name:a, type:b, k:key(a) });
  }
  return out;
}
function parseParts(rows){
  // 제목(품번/품명)을 보고 열 순서 판단 → C/D 순서가 바뀌어도 동작
  const isPnH = x => /^(품번|도번|part ?(no|number))/i.test(clean(x).replace(/\s/g,''));
  const isNmH = x => /^(품명|item ?name|name)/i.test(clean(x).replace(/\s/g,''));
  let pi = -1, ni = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = rows[i]; const a = r.findIndex(isPnH), b = r.findIndex(isNmH);
    if (a >= 0 && b >= 0) { pi = a; ni = b; start = i + 1; break; }
  }
  if (pi < 0) {   // 제목이 없으면 내용으로 추정: 숫자+하이픈이 많은 열이 품번
    const n = Math.max(...rows.slice(0,50).map(r=>r.length), 2);
    const score = j => rows.slice(0,300).filter(r => /\d/.test(r[j]||'') && /-/.test(r[j]||'')).length;
    pi = [...Array(n).keys()].sort((a,b)=>score(b)-score(a))[0]; ni = pi + 1 < n ? pi + 1 : pi - 1;
  }
  const map = new Map();
  for (const r of rows.slice(start)) {
    const pn = clean(r[pi]), nm = clean(r[ni]);
    if (!pn || isPnH(pn)) continue;
    for (const one of pn.split(/\s*[\/,\n]\s*/)) {
      const k = key(one); if (k.length < 3) continue;
      if (!map.has(k)) map.set(k, { pn: one, name: nm });
    }
  }
  return map;
}
// 발견자 명단: '발견자' 제목이 있는 열의 아래 이름들 (열이 어디로 옮겨져도 제목으로 찾음)
function parseFinders(rows){
  let ci = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 30) && ci < 0; i++) {
    const j = rows[i].findIndex(x => clean(x).replace(/\s/g,'') === '발견자');
    if (j >= 0) { ci = j; start = i + 1; }
  }
  if (ci < 0) return [];
  const seen = new Set(), out = [];
  for (const r of rows.slice(start)) { const n = clean(r[ci]); if (n && n !== '발견자' && !seen.has(n)) { seen.add(n); out.push(n); } }
  return out.sort(ko);
}
// 발행자(담당자) 명단: 제목이 '발행자'로 시작하는 열
function parsePubs(rows){
  let ci = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 30) && ci < 0; i++) {
    const j = rows[i].findIndex(x => /^발행자/.test(clean(x).replace(/\s/g,'')));
    if (j >= 0) { ci = j; start = i + 1; }
  }
  if (ci < 0) return [];
  const seen = new Set(), out = [];
  for (const r of rows.slice(start)) { const n = clean(r[ci]); if (n && !/^발행자/.test(n) && !seen.has(n)) { seen.add(n); out.push(n); } }
  return out;
}
function parseLedger(rows){
  // 제목 줄에서 열 위치 찾기: 귀책업체, 대/중/소분류, 불량내용
  let idx = null; const memo = new Map();
  for (const r of rows) {
    const c = r.map(x=>clean(x).replace(/\s/g,''));
    if (!idx) { const f = re => c.findIndex(x=>re.test(x));
      const i = { v:f(/^귀책업체/), b:f(/대분류/), m:f(/중분류/), s:f(/소분류/), t:f(/^불량내용/) };
      if (i.b>=0 && i.m>=0 && i.s>=0 && i.t>=0) idx = i; continue; }
    const t = key(r[idx.t]); if (!t || !r[idx.b]) continue;
    const lab = [clean(r[idx.b]), clean(r[idx.m]), fixSub(r[idx.s])].join(' > ');
    const m = memo.get(t) || {}; m[lab] = (m[lab]||0) + 1; memo.set(t, m);
  }
  return memo;
}

/* ================== 분류 추천 모델 ================== */
const Model = {
  m: null,
  feats(text, vendor){
    const t = String(text||'').toLowerCase().replace(/\s+/g,' ').trim();
    const c = new Map(), w = new Map(); const add=(M,k)=>M.set(k,(M.get(k)||0)+1);
    for (const word of t.split(' ')) { if (!word) continue; const p=' '+word+' ';
      for (let n=1;n<=3;n++) for (let i=0;i+n<=p.length;i++) add(c,'c:'+p.substr(i,n)); }
    const toks = t.match(/[^\s,./()]+/g) || [];
    toks.forEach((x,i)=>{ add(w,'w:'+x); if(i) add(w,'w:'+toks[i-1]+' '+x); });
    return { c, w, v: vendor ? 'v:'+vendor : null };
  },
  scores(text, vendor){
    const M = this.m, z = Float64Array.from(M.bias), F = this.feats(text, vendor);
    for (const grp of [F.c, F.w]) {
      let ss = 0; const vals = [];
      for (const [k,cnt] of grp) { const e = M.feat[k]; if (!e) continue; const x=(1+Math.log(cnt))*e[0]; vals.push([e,x]); ss+=x*x; }
      const nrm = Math.sqrt(ss) || 1;   // 학습 어휘에 있는 n-gram 기준 L2 정규화 (sklearn과 동일)
      for (const [e,x] of vals) for (let i=1;i<e.length;i++) z[e[i][0]] += e[i][1] * x / nrm;
    }
    if (F.v && M.feat[F.v]) { const e=M.feat[F.v]; for (let i=1;i<e.length;i++) z[e[i][0]] += e[i][1]; }
    return z;
  },
  predict(text, { vendor, big, allowed, memo } = {}){
    if (!this.m || !clean(text)) return [];
    const z = this.scores(text, vendor); const L = this.m.labels;
    let mx = -Infinity; const keep = [];
    for (let k=0;k<L.length;k++) {
      const lab = L[k]; const p = lab.split(' > ');
      if (big && p[0] !== big) continue;
      if (allowed && !allowed.has(lab)) continue;
      keep.push(k); if (z[k] > mx) mx = z[k];
    }
    let sum = 0; const out = keep.map(k => { const e = Math.exp(z[k]-mx); sum += e; return { label: L[k], p: e }; });
    out.forEach(o => o.p /= (sum||1));
    // 관리대장에 똑같은 문구가 있으면 그 분류를 우선
    const hist = memo && memo.get(key(text));
    if (hist) { const tot = Object.values(hist).reduce((a,b)=>a+b,0);
      for (const [lab,n] of Object.entries(hist)) { if ((big && !lab.startsWith(big+' > ')) || (allowed && !allowed.has(lab))) continue;
        let o = out.find(x=>x.label===lab); if (!o) { o={label:lab,p:0}; out.push(o); }
        o.p = 0.5*o.p + 0.5*(n/tot); o.hist = n; } }
    return out.sort((a,b)=>b.p-a.p).slice(0,3).map(o=>({ ...o, parts:o.label.split(' > ') }));
  }
};

const S = { cats:[], vendors:[], proj:[], parts:new Map(), finders:[], pubs:[], led:[], memo:null, allowed:null, tree:{} , items:[] };
// 모델 성적표 (매주 재학습 때 model_report.json 자동 갱신)
function reportPill(){
  const r = S.report; if (!r || r.recent_top1 == null) return '';
  const pct = x => Math.round(x*100) + '%';
  const d = String(r.date||'').slice(5,10).replace('-','/');
  return `<span class="pill" title="최근 60일 데이터 기준 · 학습 ${Number(r.rows||0).toLocaleString()}건 · 분류 ${r.labels||''}개">최근 정확도 ${pct(r.recent_top1)} · 3순위 ${pct(r.recent_top3)} · ${d} 학습</span>`;
}
function setStatus(){
  const p = (ok, label) => `<span class="pill ${ok===true?'ok':ok===false?'err':''}">${label}</span>`;
  $('#status').innerHTML = [
    p(S.ld.ref, '분류표 ' + (S.cats.length||'')),
    p(S.ld.ref, '귀책 ' + (S.vendors.length||'')),
    p(S.ld.proj, '프로젝트 ' + (S.proj.length||'')),
    p(S.ld.parts, '품번 ' + (S.parts.size||'')),
    p(S.ld.model, '추천모델'),
    reportPill(),
    MOCK ? p(null,'테스트 데이터') : ''
  ].join('');
}
function buildTree(){
  S.tree = {}; for (const [a,b,c] of S.cats) ((S.tree[a] ??= {})[b] ??= []).push(c);
  S.allowed = new Set(S.cats.map(x=>x.join(' > ')));
  S.vendorBig = Object.fromEntries(S.vendors.map(v=>[v.name, v.big]));
}
async function loadAll(){
  S.ld = { ref:null, proj:null, parts:null, model:null };
  // 캐시로 먼저 표시 → 최신 데이터로 갱신
  const cache = store.get('nc_cache', null);
  if (cache) { Object.assign(S, { cats:cache.cats, vendors:cache.vendors, proj:cache.proj, parts:new Map(cache.parts), finders:cache.finders||[], pubs:cache.pubs||[] }); buildTree(); }
  setStatus();
  const jobs = [
    loadSheet(CONFIG.REF, parseRef, x=>x.cats.length>0).then(([x])=>{ S.cats=x.cats; S.vendors=x.vendors; buildTree(); S.ld.ref=true; }).catch(()=>S.ld.ref=false),
    loadSheet(CONFIG.PROJ, parseProj, x=>x.length>0).then(list=>{ const m=new Map(); list.flat().forEach(p=>{ if(!m.has(p.k)) m.set(p.k,p); }); S.proj=[...m.values()]; S.ld.proj=true; }).catch(()=>S.ld.proj=false),
    loadParts().then(x=>{ S.parts=x.parts; S.finders=x.finders; S.pubs=x.pubs||[]; S.ld.parts=true; }).catch(()=>S.ld.parts=false),
    fetch('model_report.json?t=' + Date.now()).then(r=>r.ok?r.json():null).then(r=>{ S.report=r; }).catch(()=>{}),
    fetch(CONFIG.MODEL_URL).then(r=>r.json()).then(m=>{ Model.m=m; S.ld.model=true; }).catch(()=>S.ld.model=false),
  ];
  loadSheet(CONFIG.LEDGER, parseLedger, x=>x.size>0).then(list=>{ const m=new Map();
    for (const one of list) for (const [t,labs] of one) { const o=m.get(t)||{}; for (const [l,n] of Object.entries(labs)) o[l]=(o[l]||0)+n; m.set(t,o); }
    S.memo=m; if (!(S.items.length===1 && S.items[0].blank)) rerender(); }).catch(()=>{});
  for (const j of jobs) j.then(setStatus);
  await Promise.all(jobs);
  setStatus();
  // 품번(수만 개)은 저장 공간 한도를 넘을 수 있어 캐시하지 않음 → 매번 시트에서 새로 읽음
  store.set('nc_cache', { cats:S.cats, vendors:S.vendors, proj:S.proj, finders:S.finders, pubs:S.pubs });
  if ($('#src').value.trim()) run(); else { S.items = []; rerender(); }
}

/* ================== 메시지 해석 ================== */
const NUM = /^\s*(?:\(?\d{1,2}\s*[.)\]]|[①-⑳]|[-*•·▶>])\s*/;
const QTY = /(\d+)\s*(?:EA|ea|Ea|개|pcs|PCS|SET|set|세트)\b/;
const PO_RE = /\bPO[-_][A-Z0-9][A-Z0-9_-]*/i;
const KW  = s => /EFEM/i.test(s) ? 'EFEM' : /PROCESS|프로세스/i.test(s) ? 'PROCESS' : '';

function findProject(line){
  const L = key(line); let best = null;
  for (const p of S.proj) {
    if (p.k.length < 3) continue;
    const i = L.indexOf(p.k); if (i < 0) continue;
    const nx = L[i + p.k.length] || '';
    if (/[0-9]/.test(nx) && /[0-9]$/.test(p.k)) continue;  // CC04-15 ↔ CC04-157 혼동 방지
    if (!best || p.k.length > best.k.length) best = p;
  }
  if (best) return { name: best.name, raw: best.name };
  const m = line.match(/\b([A-Z]{2,5}\d{2,4}-\d{2,4}|ECP\d{3}(?:\s*#\d+)?|MISC-[A-Z0-9 ]+#\d+)\b/i);
  return m ? { name: m[1].toUpperCase(), raw: m[1], unknown: true } : null;
}
function projectType(name, kw){
  const k = key(name);
  let cands = S.proj.filter(p => p.k === k || p.k.startsWith(k));
  if (!cands.length) return { type:'', list:[] };
  let pick = cands[0];
  if (kw) pick = cands.find(p => key(p.name+p.type).includes(kw)) || pick;
  else pick = cands.find(p => p.k === k) || pick;
  let type = pick.type;
  if (kw && !type.toUpperCase().includes(kw)) type = type.replace(/\s*(EFEM|PROCESS)\s*$/i,'') + ' ' + kw;
  const list = [...new Set(cands.map(c=>c.type))];
  return { type, list };
}
function findParts(line){
  const out = [];
  const toks = line.match(/[A-Za-z0-9][A-Za-z0-9_\-().#]*[A-Za-z0-9)]/g) || [];
  for (let t of toks) {
    const k = key(t);
    if (S.parts.has(k)) { out.push({ ...S.parts.get(k), raw:t }); continue; }
    const k2 = k.replace(/[().]+$/,''); if (S.parts.has(k2)) { out.push({ ...S.parts.get(k2), raw:t }); continue; }
    // 등록 안 된 품번 모양 (영문/숫자 + 하이픈 2개 이상 또는 영문+숫자 혼합 8자 이상)
    if ((/^[A-Z0-9]+(-[A-Z0-9_]+){1,}$/i.test(t) && /\d/.test(t) && /[A-Z]/i.test(t)) && t.length >= 6) out.push({ pn:t, name:'', raw:t, unknown:true });
  }
  return out;
}
function parseMessage(text){
  const lines = text.replace(/\r/g,'').split('\n');
  const items = []; let cur = null, lastNum = 0;
  const fresh = (inherit) => ({ proj: inherit?.proj || null, kw: inherit?.kw || '', po: inherit?.po || '', part: null, qty: '', text: [] , raw:[], vendor: '', vendorRaw: '', nameLines: [] });
  const push = () => { if (cur && (cur.part || cur.text.length || cur.proj)) items.push(cur); };
  for (let raw of lines) {
    if (!raw.trim()) { if (cur && (cur.part || cur.text.length)) { push(); cur = null; } continue; }
    const nm = raw.match(/^\s*\(?(\d{1,2})\s*[.)\]]/); const num = nm ? +nm[1] : 0;
    let line = raw.replace(NUM,'').trim();
    if (!cur) cur = fresh(items[items.length-1]);
    // 같은 번호가 다시 나오면 새 건 (번호 순서가 뒤바뀌어도 한 건으로 인식)
    if (num && cur.nums && cur.nums.has(num) && (cur.part || cur.text.length)) { push(); cur = fresh(cur); }
    if (num) (cur.nums ||= new Set()).add(num);
    if (num) lastNum = num;
    // '품명 :' / '업체 :' / '귀책 :' 처럼 이름표가 붙은 줄은 따로 처리 (불량내용에 섞이지 않게)
    // '항목 : 값' 처럼 이름표가 붙은 줄 (제조팀 메시지 6항목 포함, 순서 무관)
    const lab = line.match(/^(프로젝트\s*(?:발주\s*)?명?|발\s*주\s*명|품\s*명|품\s*번|part\s*name|수\s*량|불량\s*내용|업\s*체\s*명?|귀\s*책(?:\s*업\s*체)?|협력사|요\s*청\s*자|발\s*견\s*자)\s*[:：]\s*(.*)$/i);
    if (lab) {
      const k = lab[1].replace(/\s/g,''), val = lab[2].trim();
      if (!val) continue;                                  // '3. 수량 : ' 처럼 비어 있으면 건너뜀
      if (/^(프로젝트|발주명)/.test(k)) {
        const po = val.match(PO_RE);
        if (po) cur.po = po[0].toUpperCase();
        else cur.proj = findProject(val) || { name: val.toUpperCase(), raw: val, unknown: true };
      }
      else if (k === '품번') {
        const pt = findParts(val)[0] || { pn: val.toUpperCase(), name: '', raw: val, unknown: true };
        if (cur.part && cur.part.pn !== pt.pn) { push(); cur = fresh(cur); }
        cur.part = pt;
      }
      else if (/^(품명|partname)$/i.test(k)) cur.nameLines.push(val);
      else if (k === '수량') { const q = val.match(/\d+/); if (q) cur.qty = String(+q[0]); }
      else if (k === '불량내용') cur.text.push(val);
      else if (/^(요청자|발견자)$/.test(k)) cur.finder = val;
      else { const vn = findVendor(val, true); if (vn) cur.vendor = vn; else cur.vendorRaw = val; }
      continue;
    }
    // 프로젝트
    // PO 번호 (예: PO-2026-08-4311) → 장비타입 칸에 그대로 기입, 품번/발주명으로 오인하지 않게 먼저 떼어냄
    const po = line.match(PO_RE);
    if (po) {
      if (cur.po && cur.po !== po[0].toUpperCase() && (cur.part || cur.text.length)) { push(); cur = fresh(); }
      cur.po = po[0].toUpperCase(); line = removeOnce(line, po[0]);
    }
    const pj = findProject(line);
    if (pj) {
      if (cur.proj && cur.proj.name !== pj.name && (cur.part || cur.text.length)) { push(); cur = fresh(); }
      cur.proj = pj; line = removeOnce(line, pj.raw);
    }
    const kw = KW(raw); if (kw) { cur.kw = kw; if (/^\s*(EFEM|PROCESS|프로세스)\s*$/i.test(line)) line = ''; }
    // 품번
    for (const pt of findParts(line)) {
      if (cur.part && (cur.part.pn !== pt.pn)) { push(); cur = fresh(cur); }
      cur.part = pt; line = removeOnce(line, pt.raw);
    }
    // 수량
    const q = line.match(QTY); if (q) { cur.qty = String(+q[1]); line = line.replace(QTY,''); }
    line = line.replace(/^[\s,/:|-]+|[\s,/:|-]+$/g,'').trim();
    const q2 = line.match(/^수\s*량\s*[:：]?\s*(\d+)\s*$/); if (q2) { cur.qty = String(+q2[1]); line = ''; }
    if (/^수량\s*[:：]?$/.test(line)) line = '';
    // 이름표 없이 업체명만 한 줄로 적힌 경우 (귀책 목록과 정확히 같을 때만)
    if (line) { const vn = findVendor(line, false); if (vn) { cur.vendor = vn; line = ''; } }
    if (line) cur.text.push(line);
  }
  push();
  return items;
}
// 업체명 비교용: (주)·㈜·주식회사·공백·점 등을 빼고 비교
const vkey = s => clean(s).replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|[\s.·\-]/g,'').toUpperCase();
function findVendor(v, loose){
  const k0 = vkey(v); if (!k0) return null;
  const alias = Object.entries(CONFIG.VENDOR_ALIAS||{}).find(([a]) => vkey(a) === k0);
  const k = alias ? vkey(alias[1]) : k0;
  const exact = S.vendors.find(x => vkey(x.name) === k); if (exact || !loose) return exact ? exact.name : null;
  // '업체 :' 처럼 표시된 줄은 앞부분이 같으면 인정 (예: 해룡엔지니어링(주) → 해룡엔지니어링)
  const c = S.vendors.filter(x => { const n = vkey(x.name); return n.length >= 2 && (k.startsWith(n) || n.startsWith(k)) && Math.min(n.length,k.length) >= 3; })
                     .sort((a,b) => vkey(b.name).length - vkey(a.name).length);
  return c[0]?.name || null;
}
function removeOnce(s, sub){ const i = s.toUpperCase().indexOf(String(sub).toUpperCase()); return i<0 ? s : (s.slice(0,i) + ' ' + s.slice(i+sub.length)).trim(); }

/* ================== 카드 생성 ================== */
function makeItem(p){
  const projName = p.proj?.name || '';
  // 품명: 시트에서 품번으로 찾은 품명과 같을 때만 인정 → 같은 줄은 불량내용에서 빼고, 다르면 넣지 않고 안내
  const sheetName = p.part && !p.part.unknown ? clean(p.part.name) : '';
  const same = v => sheetName && key(v) === key(sheetName);
  const text = (p.text||[]).filter(l => !same(l));
  const nameWarn = (p.nameLines||[]).filter(v => !same(v));
  const pt = projName ? projectType(projName, p.kw) : { type:'', list:[] };
  const it = {
    date: today(), proj: p.po ? 'SPARES_ACM' : projName, type: p.po || pt.type, types: p.po ? [] : pt.list, po: p.po || '', projUnknown: !p.po && (!!p.proj?.unknown || (projName && !pt.type)),
    finder: p.finder || store.get('nc_finder',''), pub: store.get('nc_pub',''), name: fmtName(p.part?.name), pn: p.part?.pn || '', partUnknown: !!p.part?.unknown,
    qty: p.qty || '1', b:'', m:'', s:'', when:'공정', text: text.join(' / '), act:'', vendor: p.vendor || '', ps:'',
    nameWarn: nameWarn[0] || '', vendorWarn: p.vendorRaw || '',
    recs: [], manual:false
  };
  recommend(it, true);
  return it;
}
function recommend(it, apply){
  const big = it.vendor ? S.vendorBig[it.vendor] : (it.manualBig ? it.b : null);
  it.recs = Model.predict(it.text, { vendor: it.vendor || null, big, allowed: S.allowed?.size ? S.allowed : null, memo: S.memo });
  if (apply && !it.manual && it.recs[0]) [it.b, it.m, it.s] = it.recs[0].parts;
  else if (big && it.b !== big) { it.b = big; it.m = ''; it.s = ''; if (it.recs[0] && !it.manual) [it.b,it.m,it.s] = it.recs[0].parts; }
}
function formatText(it){
  return [
    `발견한 날짜 : ${it.date}`,
    `프로젝트 발주명 : ${it.proj}`,
    `장비타입 : ${it.type}`,
    `발견자 : ${it.finder}`,
    `품명 : ${fmtName(it.name)}`,
    `품번 : ${it.pn}`,
    `수량 : ${qtyText(it.qty)}`,
    `발생기인(대분류) : ${it.b}`,
    `발생기인(중분류) : ${it.m}`,
    `발생기인(소분류) : ${it.s}`,
    `발생시점 : ${it.when}`,
    `불량내용 : ${it.text}`,
    `조치내용 : ${it.act}`,
    `귀책 : ${it.vendor}`,
    `P.S : ${it.ps}`
  ].join('\n');
}
// 품명 표기: 영문은 대문자, 프레임/FRAME이 들어가면 '-'
const fmtName = n => { n = clean(n); if (!n) return ''; if (CONFIG.QUICK_NAMES.includes(n.toUpperCase())) return n.toUpperCase(); if (/프레임|FRAME/i.test(n)) return '-'; return n.toUpperCase(); };
// 수량: 칸에는 숫자만, 결과에는 'EA'를 자동으로 붙임
const qtyText = q => { q = String(q||'').replace(/\D/g,''); return q ? q + ' EA' : ''; };
const ko = (a,b) => String(a).localeCompare(String(b),'ko');
// 가나다순 정렬 + 빈 선택지 없음 (값이 없을 때만 숨김 안내 문구)
const opt = (arr, v, color, order) => (v && arr.includes(v) ? [] : ['<option value="" disabled selected hidden>선택</option>'])
    .concat([...new Set(arr)].sort(order ? ((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || ko(a,b); }) : ko).map(x=>`<option${x===v?' selected':''}${color?` style="background:${color(x)}"`:''}>${esc(x)}</option>`)).join('');
const bigColor = b => CONFIG.BIG_COLORS[b] || '';
function confCls(p){ return p>=0.7?'h':p>=0.4?'m':'l'; }
function renderCard(it, i){

  if (it.nameWarn) warn.push(it.partUnknown || !it.pn

  const nd = v => clean(v) ? '' : 'need';
  const inp = (k, ph='') => `<input data-k="${k}" value="${esc(it[k])}" placeholder="${ph || (k==='ps' ? '' : '입력 필요')}" class="${k==='ps' ? '' : nd(it[k])}">`;
  return `<div class="card" data-i="${i}">

        <div class="chips">${CONFIG.QUICK_NAMES.map(n=>`<span class="chip${fmtName(it.name)===n?' on':''}" data-qname="${esc(n)}">${esc(n)}</span>`).join('')}</div>
        ${f('품번', inp('pn'))}
        ${f('수량', `<div class="qty"><input data-k="qty" value="${esc(it.qty)}" inputmode="numeric" pattern="[0-9]*" placeholder="입력 필요" class="${nd(it.qty)}"><span>EA</span></div>`)}
        ${f('귀책', `<div class="combo"><input data-k="vendor" data-combo="vendor" value="${esc(it.vendor)}" placeholder="입력 필요 · 업체명 초성 검색 (예: ㅇㅍ)" autocomplete="off" class="${nd(it.vendor)}"><div class="dd"></div></div>`)}
        ${f('발생기인', (() => { const bc = bigColor(it.b), st = bc ? ` class="csel" style="background:${bc}"` : '';

function rerender(){

function refreshOut(i){ document.querySelector(`.card[data-i="${i}"] [data-out]`).textContent = formatText(S.items[i]); }

/* ================== 귀책 검색 (초성 지원) ================== */
function vendorMatches(q, big){
  q = splitJamo(q);
  const list = S.vendors.length ? S.vendors : [];
  const qq = clean(q).toLowerCase(), qc = choseong(qq);
  const score = v => { const n=v.name.toLowerCase(), c=choseong(n);
    if (!qq) return 1; if (n.startsWith(qq)) return 4; if (n.includes(qq)) return 3; if (c.startsWith(qc)) return 2; if (c.includes(qc)) return 1; return 0; };
  // 발생기인 대분류가 정해져 있으면 그 대분류의 귀책만 보여줌
  return list.filter(v=>!big || v.big===big).map(v=>({v,s:score(v)})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s || ko(a.v.name,b.v.name)).slice(0,30).map(x=>x.v);
}
// 겹자음(ㄳ, ㅄ 등)을 낱자로 풀기 → 초성 한 글자씩 검색되게
const JAMO2 = {'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
const splitJamo = s => String(s||'').replace(/[ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ]/g, c => JAMO2[c]);
function nameMatches(q, names){
  q = splitJamo(q);
  const qq = clean(q).toLowerCase(), qc = choseong(qq);
  const score = n => { const l=n.toLowerCase(), c=choseong(l);
    if (!qq) return 1; if (l.startsWith(qq)) return 4; if (l.includes(qq)) return 3; if (c.startsWith(qc)) return 2; if (c.includes(qc)) return 1; return 0; };
  return names.map(n=>({n,s:score(n)})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s || ko(a.n,b.n)).slice(0,30).map(x=>x.n);
}
function openDD(input){

  } else {
    const list = vendorMatches(input.value, it.b);
    dd.innerHTML = list.map((v,j)=>`<div data-v="${esc(v.name)}" class="${j===0?'act':''}">${esc(v.name)}<small>${esc(v.big)}</small></div>`).join('') || '<div><small>결과 없음</small></div>';
  }
  dd.style.display = 'block';
}
function pickFinder(i, name){ const it = S.items[i]; it.finder = name; store.set('nc_finder', name); S.items.forEach((x,j)=>{ if (j!==i && !x.finder) x.finder = name; }); rerender(); }
function pickCombo(el, name){ const i = +el.closest('.card').dataset.i; return el.dataset.combo === 'finder' ? pickFinder(i, name) : pickVendor(i, name); }

  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('복사했어요');
}

  if (k==='b') { it.b = el.value; it.m=''; it.s=''; it.manual = true; it.manualBig = true;
    if (it.vendor && S.vendorBig[it.vendor] && S.vendorBig[it.vendor] !== it.b) it.vendor = '';
    const r = Model.predict(it.text, { big: it.b, allowed:S.allowed, memo:S.memo }); if (r[0]) [,it.m,it.s] = r[0].parts; it.recs = r; return refreshCard(i); }
  if (k==='m') { it.m = el.value; it.s=''; it.manual = true; const r = it.recs.find(x=>x.parts[0]===it.b && x.parts[1]===it.m); if (r) it.s = r.parts[2]; return refreshCard(i); }
  if (k==='s') { it.s = el.value; it.manual = true; return refreshCard(i); }
  if (k==='text') { if (!it.manual) recommend(it, true); return refreshCard(i); }
  if (k==='proj') { const pj = findProject(it.proj); const pt = projectType(pj?.name || it.proj, KW(it.proj) || ''); it.type = pt.type || it.type; it.types = pt.list; it.projUnknown = !pt.type; return refreshCard(i); }
  if (k==='pn') { const p = S.parts.get(key(it.pn)); if (p) { it.name = fmtName(p.name); it.partUnknown = false; } return refreshCard(i); }
  refreshOut(i);
});
cards.addEventListener('keydown', e => {
  const el = e.target; if (!el.hasAttribute('data-combo')) return;
  const dd = el.nextElementSibling, items = [...dd.querySelectorAll('[data-v]')]; let a = items.findIndex(x=>x.classList.contains('act'));
  if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); if(!items.length) return; items[a]?.classList.remove('act'); a = (a + (e.key==='ArrowDown'?1:-1) + items.length) % items.length; items[a].classList.add('act'); items[a].scrollIntoView({block:'nearest'}); }
  if (e.key==='Enter') { e.preventDefault(); const pick = items[a] || items[0]; if (pick) pickCombo(el, pick.dataset.v); }
  if (e.key==='Escape') dd.style.display='none';
});
cards.addEventListener('focusin', e => { if (e.target.hasAttribute('data-combo')) openDD(e.target); });
document.addEventListener('mousedown', e => { if (!e.target.closest('.combo')) document.querySelectorAll('.dd').forEach(d=>d.style.display='none'); });
cards.addEventListener('focusout', e => {

  setTimeout(() => { const card = el.closest('.card'); if (!card || card.contains(document.activeElement) && document.activeElement===el) return;
    const i = +card.dataset.i, it = S.items[i];
    if (el.dataset.combo !== 'vendor') return;
    if (S.vendorBig[it.vendor] && S.vendorBig[it.vendor] !== it.b) pickVendor(i, it.vendor); }, 150);
});

/* ================== 모달 ================== */
function modal({ title='', body='', buttons=[{label:'확인', value:true, cls:'pri'}], input=null, wide=false }){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox ${wide?'wide':''}"><h3>${esc(title)}</h3>${body?`<div class="mb">${body}</div>`:''}
      ${input?`<input type="${input.type||'text'}" class="minp" placeholder="${esc(input.placeholder||'')}" autocomplete="off" style="margin-top:4px">`:''}
      <div class="mbtn">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-mi="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const done = v => { m.remove(); document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key==='Escape') done(null); if (e.key==='Enter' && input) { e.preventDefault(); done(m.querySelector('.minp').value); } };
    m.addEventListener('click', e => { const b = e.target.closest('[data-mi]'); if (b) { const bt = buttons[+b.dataset.mi]; done(input && bt.value===true ? m.querySelector('.minp').value : bt.value); } else if (e.target===m) done(null); });
    document.addEventListener('keydown', key);
    document.body.appendChild(m);
    (m.querySelector('.minp') || m.querySelector('.btn.pri') || m.querySelector('.btn'))?.focus();
    m.getForm = () => m;
    if (modal.onOpen) modal.onOpen(m);
  });
}
const msg = (title, body='') => modal({ title, body: body?`<p>${body}</p>`:'' });

/* ================== 관리대장 서버(Apps Script) 연결 ================== */
const MOCK_DB = { seq:0, items:[], fps:[] };
async function api(action, data={}, needPw=false){
  if (needPw) {
    let pw = sessionStorage.getItem('nc_pw');
    for (let tries = 0; tries < 3; tries++) {
      if (!pw) { pw = await modal({ title:'비밀번호', body:'<p>수정·삭제·동기화는 비밀번호가 필요해요.</p>', input:{type:'password', placeholder:'비밀번호'}, buttons:[{label:'취소', value:null},{label:'확인', value:true, cls:'pri'}] }); if (!pw) return null; }
      const r = await call(action, { ...data, pw });
      if (r && r.error === 'badpw') { sessionStorage.removeItem('nc_pw'); pw = null; await msg('비밀번호가 틀렸어요', '비밀번호를 다시 확인해 주세요.'); continue; }
      try { sessionStorage.setItem('nc_pw', pw); } catch(e){}
      return r;
    }
    return null;
  }
  return call(action, data);
}
async function call(action, data){
  if (MOCK) return mockApi(action, data);   // ?mock=1 테스트 때는 가짜 서버 사용
  if (!CONFIG.API_URL) throw new Error('관리대장 서버 주소가 아직 설정되지 않았어요');
  const r = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify({ action, ...data }) });
  const j = await r.json();
  if (!j.ok && j.error !== 'badpw') throw new Error(j.error || '서버 오류');
  return j;
}
function mockApi(a, d){   // 테스트(?mock=1)용 가짜 서버
  const st = MOCK_DB;
  if (a!=='list' && a!=='check' && a!=='add' && d.pw !== 'vnawlf') return { ok:false, error:'badpw' };
  if (a==='list') return { ok:true, items: JSON.parse(JSON.stringify(st.items)) };
  if (a==='check') return { ok:true, exists: st.fps.includes(d.fp) };
  if (a==='add') { if (st.fps.includes(d.fp)) return { ok:true, dup:true }; st.seq++; const it={ id:'WEB-TEST-'+String(st.seq).padStart(4,'0'), seq:st.seq, fp:d.fp, f:{...d.f}, synced:false, dirty:false }; st.items.push(it); st.fps.push(d.fp); return { ok:true, item:it }; }
  if (a==='update') { const it = st.items.find(x=>x.id===d.id); it.f = {...d.f}; if (!st.fps.includes(d.fp)) st.fps.push(d.fp); if (it.synced) it.dirty = true; return { ok:true }; }
  if (a==='delete') { st.items = st.items.filter(x=>!d.ids.includes(x.id)); return { ok:true }; }
  if (a==='deleteSynced') { st.items = st.items.filter(x=>!(x.synced && !x.dirty)); return { ok:true }; }
  if (a==='sync') { const ymd=s=>String(s||'').replace(/\D/g,''); const f=ymd(d.from), t=ymd(d.to); let added=0, updated=0;
    st.items.filter(x=>(!x.synced||x.dirty) && (!f||ymd(x.f.date)>=f) && (!t||ymd(x.f.date)<=t)).forEach(x=>{ x.synced ? updated++ : added++; x.synced=true; x.dirty=false; });
    return { ok:true, added, updated, sheet:'수입공정 부적합 (테스트)' }; }
  return { ok:false, error:'unknown' };
}

// 관리대장에 넣을 값 / 같은 건 판단용 지문 (양식 15줄 + 발행자까지 같으면 같은 건)
const toF = it => ({ date: it.date, proj: it.proj, type: it.type, name: fmtName(it.name), pn: it.pn, qty: String(it.qty||'').replace(/\D/g,''),
  vendor: it.vendor, b: it.b, m: it.m, s: it.s, when: it.when, finder: it.finder, pub: it.pub, text: it.text, act: it.act, ps: it.ps });
async function fpOf(f){
  const t = ['date','proj','type','finder','name','pn','qty','b','m','s','when','text','act','vendor','ps','pub'].map(k => clean(f[k])).join('␞');
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(h)].slice(0, 12).map(b => b.toString(16).padStart(2,'0')).join('');
}

// [복사] 후: 관리대장 탭에 올릴지 묻기
async function askUpload(it){
  if (!CONFIG.API_URL && !MOCK) return;
  await new Promise(r => setTimeout(r, 350));
  if (!clean(it.pub)) {
    await msg('발행자를 선택해 주세요', '관리대장 탭에 올리려면 카드 맨 아래 발행자를 먼저 선택해야 해요. 선택한 뒤 [복사]를 다시 눌러주세요.');
    return;
  }
  try {
    const f = toF(it), fp = await fpOf(f);
    const c = await api('check', { fp });
    if (c.exists) return msg('업로드 완료된 건입니다', '같은 내용(발행자 포함)이 이미 관리대장 탭에 올라가 있어요.');
    const ok = await modal({ title:'관리대장 탭에 업로드 하시겠습니까?', body:`<p>${esc(f.pn || f.proj)} · ${esc(f.text)}</p>`, buttons:[{label:'아니오', value:false},{label:'예', value:true, cls:'pri'}] });
    if (!ok) return;
    const r = await api('add', { fp, f });
    if (r.dup) return msg('업로드 완료된 건입니다', '같은 내용(발행자 포함)이 이미 관리대장 탭에 올라가 있어요.');
    toast('관리대장 탭에 올렸어요 — 입력 내용을 지웠어요'); loadLedger();
    // 발행 완료된 건은 입력 내용 자동 삭제 (여러 건이면 그 카드만, 마지막 건이면 붙여넣기 칸까지)
    const idx = S.items.indexOf(it); if (idx >= 0) S.items.splice(idx, 1);
    if (!S.items.length || S.items.every(x => x.blank)) { $('#src').value = ''; S.items = []; }
    rerender(); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) { msg('관리대장 연결 오류', esc(e.message)); }
}

/* ================== 관리대장 탭 ================== */
let ledTimer = null, ledBusy = false;
function showTab(t){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#tab-conv').style.display = t === 'conv' ? '' : 'none';
  $('#tab-ledger').style.display = t === 'ledger' ? '' : 'none';
  store.set('nc_tab', t);
  clearInterval(ledTimer);
  if (t === 'ledger') { loadLedger(); ledTimer = setInterval(() => { if (!document.hidden && !document.querySelector('.modal')) loadLedger(); }, 10000); }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
async function loadLedger(){
  if (ledBusy) return; ledBusy = true;
  try {
    const r = await api('list');
    S.led = (r.items || []).sort((a,b) => a.seq - b.seq);
    renderLedger();
    const t = new Date(); $('#ledInfo').textContent = `${S.led.length}건 · 대기 ${S.led.filter(x=>!x.synced).length} · 수정됨 ${S.led.filter(x=>x.dirty).length} · 동기화 완료 ${S.led.filter(x=>x.synced&&!x.dirty).length} · ${t.toTimeString().slice(0,8)} 갱신`;
  } catch(e) { $('#ledInfo').textContent = '연결 안 됨: ' + e.message; }
  finally { ledBusy = false; }
}
function renderLedger(){
  const pend = S.led.filter(x => !x.synced || x.dirty).length, b = $('#ledBadge');
  b.style.display = pend ? '' : 'none'; b.textContent = pend;
  if (!S.led.length) { $('#ledBody').innerHTML = '<tr><td colspan="19" class="mut" style="padding:24px">아직 올라온 건이 없어요. 변환기 탭에서 [복사] → [예]를 누르면 여기에 쌓여요.</td></tr>'; return; }
  $('#ledBody').innerHTML = S.led.map((x, i) => { const f = x.f, st = x.dirty ? '<span class="st dirty">수정됨</span>' : x.synced ? '<span class="st done">동기화 완료</span>' : '<span class="st wait">대기</span>';
    return `<tr class="${x.synced && !x.dirty ? 'done' : ''}" data-id="${esc(x.id)}"><td>${i+1}</td><td>${st}</td><td>${esc(f.date)}</td><td>${esc(f.proj)}</td><td>${esc(f.type)}</td><td>${esc(f.name)}</td><td>${esc(f.pn)}</td><td>${esc(f.qty)}</td><td>${esc(f.vendor)}</td>
      <td>${esc(f.b)}</td><td>${esc(f.m)}</td><td>${esc(f.s)}</td><td>${esc(f.when)}</td><td>${esc(f.finder)}</td><td>${esc(f.pub)}</td><td class="wrap">${esc(f.text)}</td><td>${esc(f.act)}</td><td class="wrap">${esc(f.ps)}</td>
      <td><button class="btn sm" data-ed>수정</button> <button class="btn sm danger" data-rm>삭제</button></td></tr>`; }).join('');
}
$('#ledRefresh').onclick = loadLedger;
$('#ledBody').addEventListener('click', async e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return; const x = S.led.find(y => y.id === tr.dataset.id); if (!x) return;
  try {
    if (e.target.closest('[data-rm]')) {
      if (!await modal({ title:'이 건을 삭제할까요?', body:`<p>${esc(x.f.pn)} · ${esc(x.f.text)}</p><p>관리대장 탭에서만 지워져요. 이미 동기화된 시트 행은 그대로 남아요.</p>`, buttons:[{label:'취소', value:false},{label:'삭제', value:true, cls:'pri'}] })) return;
      const r = await api('delete', { ids:[x.id] }, true); if (r) { toast('삭제했어요'); loadLedger(); }
    }
    if (e.target.closest('[data-ed]')) editRow(x);
  } catch(err) { msg('오류', esc(err.message)); }
});
async function editRow(x){
  const f = { ...x.f };
  const inpE = (k, lab, extra='') => `<label>${lab}</label><input data-e="${k}" value="${esc(f[k])}" ${extra}>`;
  const selE = (k, lab, arr) => `<label>${lab}</label><select data-e="${k}">${[...new Set([f[k], ...arr])].filter(v=>v!==undefined).map(v=>`<option${v===f[k]?' selected':''}>${esc(v)}</option>`).join('')}</select>`;
  const bigs = Object.keys(S.tree);
  const body = `<div class="efrm">
    ${inpE('date','발생일','placeholder="2026.10.03"')}${inpE('proj','발주 프로젝트명')}${inpE('type','TYPE / PO No.')}${inpE('name','품명')}${inpE('pn','품번')}${inpE('qty','수량','inputmode="numeric"')}
    ${inpE('vendor','귀책업체')}${selE('b','대분류', bigs)}${selE('m','중분류', Object.keys(S.tree[f.b]||{}))}${selE('s','소분류', (S.tree[f.b]||{})[f.m]||[])}
    ${selE('when','구분', ['수입','공정','출하'])}${inpE('finder','발견자')}${selE('pub','담당자(발행자)', S.pubs)}${inpE('text','불량내용')}${inpE('act','조치사항')}${inpE('ps','비고')}</div>`;
  modal.onOpen = m => {   // 대분류 → 중분류 → 소분류 연동
    const g = k => m.querySelector(`[data-e="${k}"]`);
    const fill = (el, arr) => { el.innerHTML = arr.map(v=>`<option>${esc(v)}</option>`).join(''); };
    g('b').onchange = () => { fill(g('m'), Object.keys(S.tree[g('b').value]||{})); fill(g('s'), (S.tree[g('b').value]||{})[g('m').value]||[]); };
    g('m').onchange = () => fill(g('s'), (S.tree[g('b').value]||{})[g('m').value]||[]);
    modal.lastForm = m;
  };
  const ok = await modal({ title:'관리대장 건 수정', body, wide:true, buttons:[{label:'취소', value:false},{label:'저장', value:true, cls:'pri'}] });
  const m = modal.lastForm; modal.onOpen = null; modal.lastForm = null;
  if (!ok) return;
  m.querySelectorAll('[data-e]').forEach(el => f[el.dataset.e] = el.value.trim());
  f.qty = String(f.qty||'').replace(/\D/g,''); f.name = fmtName(f.name);
  try { const r = await api('update', { id:x.id, f, fp: await fpOf(f) }, true); if (r) { toast(x.synced ? '수정했어요 — 다음 동기화 때 시트에 반영돼요' : '수정했어요'); loadLedger(); } }
  catch(err) { msg('오류', esc(err.message)); }
}
async function doSync(range){
  const from = range ? $('#syncFrom').value : '', to = range ? $('#syncTo').value : '';
  if (range && !from && !to) return msg('기간을 정해 주세요', '조건부 동기화는 발생일 시작일이나 종료일 중 하나 이상을 정해야 해요.');
  const ymd = s => String(s||'').replace(/\D/g,'');
  const tg = S.led.filter(x => (!x.synced || x.dirty) && (!from || ymd(x.f.date) >= ymd(from)) && (!to || ymd(x.f.date) <= ymd(to)));
  if (!tg.length) return msg('동기화할 건이 없어요', '대기 중이거나 수정된 건이 없어요.');
  if (!await modal({ title: range ? '조건부 동기화' : '일괄 동기화', body:`<p>${tg.length}건(새로 ${tg.filter(x=>!x.synced).length} · 수정 ${tg.filter(x=>x.dirty).length})을 관리대장 구글시트에 반영할까요?</p>`, buttons:[{label:'취소', value:false},{label:'동기화', value:true, cls:'pri'}] })) return;
  toast('동기화 중… 잠시만 기다려 주세요');
  try { const r = await api('sync', { from, to }, true); if (r) { await msg('동기화 완료', `${esc(r.sheet||'')} 시트에 새로 ${r.added}건, 수정 ${r.updated}건을 반영했어요.`); loadLedger(); } }
  catch(err) { msg('동기화 오류', esc(err.message)); }
}
$('#syncRange').onclick = () => doSync(true);
$('#syncAll').onclick = () => doSync(false);
$('#delSynced').onclick = async () => {
  const n = S.led.filter(x => x.synced && !x.dirty).length;
  if (!n) return msg('지울 건이 없어요', '동기화 완료된 건이 없어요.');
  if (!await modal({ title:'동기화 완료건 일괄삭제', body:`<p>동기화 완료된 ${n}건을 관리대장 탭에서 지울까요? 시트에 올라간 내용은 그대로 남아요.</p>`, buttons:[{label:'취소', value:false},{label:'삭제', value:true, cls:'pri'}] })) return;
  try { const r = await api('deleteSynced', {}, true); if (r) { toast('지웠어요'); loadLedger(); } } catch(err) { msg('오류', esc(err.message)); }
};
