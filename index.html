<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>부적합 양식 변환기</title>
<style>
:root{
  --empty:#f9cdc6; --bg:#ffffff; --bg2:#f6f8fa; --bd:#d0d7de; --bd2:#d8dee4; --fg:#1f2328; --mut:#59636e;
  --acc:#0969da; --acc-bg:#ddf4ff; --ok:#1a7f37; --ok-bg:#dafbe1; --btn:#1f883d; --btn-h:#1a7f37;
  --warn:#9a6700; --warn-bg:#fff8c5; --err:#d1242f; --err-bg:#ffebe9; --sh:0 1px 0 rgba(31,35,40,.04);
}
html{color-scheme:only light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif}
header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.logo svg{flex:none}
.status{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--bd);border-radius:2em;padding:0 8px;background:var(--bg)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.err{color:var(--err);border-color:var(--err)}
main{max-width:1080px;margin:0 auto;padding:16px}
.box{border:1px solid var(--bd);border-radius:6px;background:var(--bg);box-shadow:var(--sh);margin-bottom:16px}
.box-h{background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 12px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box-h h2{font-size:14px;margin:0;font-weight:600}
.box-b{padding:12px}
textarea,input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
#src{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:6px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--btn);border-color:rgba(31,35,40,.15);color:#fff}
.btn.pri:hover{background:var(--btn-h)}
.btn.sm{padding:2px 10px;font-size:12px}
.mut{color:var(--mut);font-size:12px}
.finder{width:auto;flex:1;min-width:140px;max-width:220px}
.card{border:1px solid var(--bd);border-radius:6px;margin-bottom:16px;background:var(--bg)}
.card .box-h{justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.form{padding:12px;border-right:1px solid var(--bd2)}
.f{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:6px}
.f label{font-size:12px;color:var(--mut);font-weight:600}
.cat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px 118px}
.chip{font-size:12px;border:1px solid var(--bd);border-radius:2em;padding:1px 10px;background:var(--bg2);cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--acc)} .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.chip b{font-weight:600}
.conf{font-size:11px;border-radius:2em;padding:0 8px;font-weight:600}
.conf.h{background:var(--ok-bg);color:var(--ok)} .conf.m{background:var(--warn-bg);color:var(--warn)} .conf.l{background:var(--err-bg);color:var(--err)}
.out{padding:12px;display:flex;flex-direction:column}
.out pre{margin:0;flex:1;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans KR",monospace}
.warn{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:4px 8px;margin:0 0 8px}
.combo{position:relative}
.dd{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:2px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;box-shadow:0 8px 24px rgba(66,74,83,.2);max-height:240px;overflow:auto;display:none}
.dd div{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.dd div small{color:var(--mut)}
.dd div:hover,.dd div.act{background:var(--acc-bg)}
.actsel{display:flex;flex-wrap:wrap;gap:6px}
.csel{color:#1f2328}
.csel option{color:#1f2328}
input.need{background:var(--empty);border-color:#e0a49a;color:#1f2328}
input.need::placeholder{color:#8a4a40}
.ac{font:inherit;font-size:13px;border:1px solid transparent;border-radius:2em;padding:2px 12px;cursor:pointer;color:#1f2328}
.ac:hover{border-color:rgba(31,35,40,.4)}
.ac.on{border-color:#1f2328;font-weight:600;box-shadow:0 0 0 1px #1f2328 inset}
.ac.on::before{content:'✓ '}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:32px 12px}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .form{border-right:0;border-bottom:1px solid var(--bd2)}
  .f{grid-template-columns:1fr;gap:2px}
  .chips{margin-left:0}
  .status{margin-left:0;width:100%}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688ZM7.5 7.75a.75.75 0 0 1 1.5 0v2.5a.75.75 0 0 1-1.5 0Zm.75 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>부적합 양식 변환기</div>
  <div class="status" id="status"></div>
</div></header>
<main>
  <section class="box">
    <div class="box-h"><h2>메시지 붙여넣기</h2><span class="mut">순서·번호 상관없이 발주명 / 품번 / 불량내용 (여러 건은 빈 줄로 구분)</span></div>
    <div class="box-b">
      <textarea id="src" placeholder="&lt;입력예시&gt;&#10;1.CC04-157&#10;2.SE-100P44-3&#10;3.탭 누락&#10;&#10;※ 부적합처리방 문구 복사 붙여넣기"></textarea>
      <div class="row">
        <button class="btn pri" id="go">변환</button>
        <button class="btn" id="clear">지우기</button>
        <span class="mut" style="margin-left:auto">Ctrl+Enter로 변환</span>
      </div>
    </div>
  </section>
  <div class="row" id="allbar" style="display:none;margin:-4px 0 12px">
    <span class="mut" id="cnt"></span>
    <button class="btn pri sm" id="copyall" style="margin-left:auto">전체 복사</button>
  </div>
  <div id="cards"></div>
</main>
<div class="toast" id="toast"></div>

<script>
/* ================== 설정 ================== */
const CONFIG = {
  SHEET_ID: '1hWRxLYkJfPEBfItSNKv7IFuSOFcLI35b9jCHnKVRBtE',
  // 시트 찾는 순서: ① 올해 연도 이름 → ② 시트 고유번호(gid, 이름을 바꿔도 유지됨) → ③ 작년 연도 이름
  //   내용(제목 줄)이 맞는지 확인한 뒤 사용하므로, 연도가 바뀌어 이름이 달라져도 자동으로 찾아감
  REF:   { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288',  range: 'AD1:AF3000' },  // 분류표(6.1) + 귀책(6.3)
  PROJ:  { names: y=>[`참조(${y})`,`참조 (${y})`], gid: '664632288',  range: 'L1:M5000', merge: true }, // 발주명(L) / TYPE(M), 올해+작년 합침
  PARTS: { gid: '1577658176', range: 'A1:Z20000' },                                       // 품명/품번 시트 (제목 '품번'/'품명'/'발견자' 글자로 열 위치 자동 판단)
  LEDGER:{ names: y=>[`수입공정 부적합 (${y})`,`수입/공정 부적합 (${y})`,`수입공정 부적합(${y})`], gid: '638838738', range: 'K1:S20000', merge: true }, // 관리대장 이력
  MODEL_URL: 'model.json',
  UPPER: ['TAP','HOLE','BURR'],         // 대문자로 통일할 소분류
  BIG_COLORS: {                          // 발생기인 대분류별 색상 (구글시트 칩 색상)
    '제조불량':'#d5ecbf', '기구설계불량':'#e5d2f2', '전장설계불량':'#e5d2f2', '제어설계불량':'#e5d2f2',
    '업체불량':'#c7e1f7', '기타불량':'#e6e8eb'
  },
  BIG_ORDER: ['업체불량','제조불량','기구설계불량','전장설계불량','제어설계불량','기타불량'],   // 대분류 표시 순서
  WHEN: [['수입','#c7e1f7'], ['공정','#fde79a'], ['출하','#d5ecbf']],   // 발생시점 버튼
  EMPTY_COLOR: '#f9cdc6',                 // 비어 있는 품명 칸 표시 (업체반출 색)
  ACTIONS: [                              // 조치내용 드롭다운 (구글시트 칩 색상)
    ['방문조치','#fde79a'], ['업체반출','#f9cdc6'], ['자체처리','#d5ecbf'], ['정상진행','#c7e1f7'],
    ['재발주','#e5d2f2'], ['입고요청','#ec9a96'], ['현물수정','#e5d2f2'], ['폐기','#e6e8eb']
  ]
};
const MOCK = new URLSearchParams(location.search).has('mock');

/* ================== 유틸 ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => String(s ?? '').replace(/\s+/g,' ').trim();
const key = s => clean(s).toUpperCase().replace(/\s+/g,'');
const fixSub = s => { const u = clean(s).replace(/\s+/g,''); return CONFIG.UPPER.includes(u.toUpperCase()) ? u.toUpperCase() : clean(s); };
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function today(){ const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choseong = s => [...String(s)].map(ch => { const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch; }).join('');

/* ================== 구글시트 읽기 (JSONP, 공개 링크) ================== */
let jsonpN = 0;
// 여러 후보 시트를 순서대로 시도 → 내용 검사(ok)를 통과한 결과만 사용
async function loadSheet(cfg, parse, ok){
  const Y = new Date().getFullYear(), seen = new Set(), cands = [];
  const add = c => { const k = c.sheet || 'gid:'+c.gid; if (!seen.has(k)) { seen.add(k); cands.push(c); } };
  (cfg.names ? cfg.names(Y) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  if (cfg.gid) add({ gid:cfg.gid, range:cfg.range });
  (cfg.names ? cfg.names(Y-1) : []).forEach(n => add({ sheet:n, range:cfg.range }));
  const got = [], sigs = new Set();
  for (const c of cands) {
    try {
      const rows = MOCK ? await gviz(cfg) : await gviz(c);
      const sig = rows.length + '|' + JSON.stringify(rows.slice(0,8));   // 같은 시트를 이름·gid로 두 번 읽은 경우 제외
      if (sigs.has(sig)) continue;
      const x = parse(rows); if (!ok(x)) continue;
      sigs.add(sig); got.push(x);
      if (!cfg.merge || MOCK) break;
    } catch(e) {}
  }
  if (!got.length) throw new Error('시트를 찾지 못함');
  return got;
}
function gviz(src){
  if (MOCK) {
    const f = src===CONFIG.REF?'ref_AD_AF':src===CONFIG.PROJ?'proj_L_M':src===CONFIG.PARTS?'parts_C_D':null;
    return f ? fetch('mock/'+f+'.json').then(r=>r.json()) : Promise.reject(new Error('mock 없음'));
  }
  return new Promise((res, rej) => {
    const cb = '__gv' + (++jsonpN) + '_' + Date.now();
    const p = new URLSearchParams({ tqx:'out:json;responseHandler:'+cb, headers:'0', range: src.range });
    if (src.sheet) p.set('sheet', src.sheet); else if (src.gid) p.set('gid', src.gid);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(to); };
    const to = setTimeout(() => { done(); rej(new Error('시간 초과')); }, 20000);
    window[cb] = resp => { done();
      if (resp.status === 'error') return rej(new Error((resp.errors||[])[0]?.detailed_message || '시트 오류'));
      const rows = (resp.table?.rows || []).map(r => (r.c || []).map(c => c ? String(c.f ?? c.v ?? '') : ''));
      res(rows);
    };
    s.onerror = () => { done(); rej(new Error('불러오기 실패')); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?` + p.toString();
    document.head.appendChild(s);
  });
}

/* ================== 데이터 파싱 (제목 글자로 위치 찾기 → 행이 늘어나도 따라감) ================== */
const isTitle = s => /^\s*\d+(\.\d+)+\s/.test(s||'');   // "6.1 ...", "6.3 ..." 같은 구역 제목
function parseRef(rows){
  const cats = [], vendors = [];
  let mode = null, section = 0;
  for (const r of rows) {
    const [a='', b='', c=''] = r.map(clean);
    if (isTitle(a)) { mode = null; continue; }
    if (a==='대분류' && b==='중분류' && c==='소분류') { section++; mode = section===1 ? 'cat' : 'skip'; continue; } // 첫 분류표(6.1)만 사용, 6.2 제외
    if (a==='대분류' && b==='세부귀책') { mode = 'ven'; continue; }
    if (!a && !b && !c) continue;                    // 빈 줄 무시
    if (mode==='cat' && a && b && c) cats.push([a,b,fixSub(c)]);
    else if (mode==='ven' && a && b) vendors.push({ big:a, name:b });
  }
  const seen = new Set();
  return { cats: cats.filter(x=>{const k=x.join('>'); if(seen.has(k))return false; seen.add(k); return true;}), vendors };
}
function parseProj(rows){
  const out = []; let on = false;
  for (const r of rows) {
    const [a='', b=''] = r.map(clean);
    if (!on) { if (/발주명|PROJECT/i.test(a) && /^TYPE|타입/i.test(b)) on = true; continue; }
    if (a && b && !/발주명|PROJECT/i.test(a)) out.push({ name:a, type:b, k:key(a) });
  }
  return out;
}
function parseParts(rows){
  // 제목(품번/품명)을 보고 열 순서 판단 → C/D 순서가 바뀌어도 동작
  const isPnH = x => /^(품번|도번|part ?(no|number))/i.test(clean(x).replace(/\s/g,''));
  const isNmH = x => /^(품명|item ?name|name)/i.test(clean(x).replace(/\s/g,''));
  let pi = -1, ni = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = rows[i]; const a = r.findIndex(isPnH), b = r.findIndex(isNmH);
    if (a >= 0 && b >= 0) { pi = a; ni = b; start = i + 1; break; }
  }
  if (pi < 0) {   // 제목이 없으면 내용으로 추정: 숫자+하이픈이 많은 열이 품번
    const n = Math.max(...rows.slice(0,50).map(r=>r.length), 2);
    const score = j => rows.slice(0,300).filter(r => /\d/.test(r[j]||'') && /-/.test(r[j]||'')).length;
    pi = [...Array(n).keys()].sort((a,b)=>score(b)-score(a))[0]; ni = pi + 1 < n ? pi + 1 : pi - 1;
  }
  const map = new Map();
  for (const r of rows.slice(start)) {
    const pn = clean(r[pi]), nm = clean(r[ni]);
    if (!pn || isPnH(pn)) continue;
    for (const one of pn.split(/\s*[\/,\n]\s*/)) {
      const k = key(one); if (k.length < 3) continue;
      if (!map.has(k)) map.set(k, { pn: one, name: nm });
    }
  }
  return map;
}
// 발견자 명단: '발견자' 제목이 있는 열의 아래 이름들 (열이 어디로 옮겨져도 제목으로 찾음)
function parseFinders(rows){
  let ci = -1, start = 0;
  for (let i = 0; i < Math.min(rows.length, 30) && ci < 0; i++) {
    const j = rows[i].findIndex(x => clean(x).replace(/\s/g,'') === '발견자');
    if (j >= 0) { ci = j; start = i + 1; }
  }
  if (ci < 0) return [];
  const seen = new Set(), out = [];
  for (const r of rows.slice(start)) { const n = clean(r[ci]); if (n && n !== '발견자' && !seen.has(n)) { seen.add(n); out.push(n); } }
  return out.sort(ko);
}
function parseLedger(rows){
  // 제목 줄에서 열 위치 찾기: 귀책업체, 대/중/소분류, 불량내용
  let idx = null; const memo = new Map();
  for (const r of rows) {
    const c = r.map(x=>clean(x).replace(/\s/g,''));
    if (!idx) { const f = re => c.findIndex(x=>re.test(x));
      const i = { v:f(/^귀책업체/), b:f(/대분류/), m:f(/중분류/), s:f(/소분류/), t:f(/^불량내용/) };
      if (i.b>=0 && i.m>=0 && i.s>=0 && i.t>=0) idx = i; continue; }
    const t = key(r[idx.t]); if (!t || !r[idx.b]) continue;
    const lab = [clean(r[idx.b]), clean(r[idx.m]), fixSub(r[idx.s])].join(' > ');
    const m = memo.get(t) || {}; m[lab] = (m[lab]||0) + 1; memo.set(t, m);
  }
  return memo;
}

/* ================== 분류 추천 모델 ================== */
const Model = {
  m: null,
  feats(text, vendor){
    const t = String(text||'').toLowerCase().replace(/\s+/g,' ').trim();
    const c = new Map(), w = new Map(); const add=(M,k)=>M.set(k,(M.get(k)||0)+1);
    for (const word of t.split(' ')) { if (!word) continue; const p=' '+word+' ';
      for (let n=1;n<=3;n++) for (let i=0;i+n<=p.length;i++) add(c,'c:'+p.substr(i,n)); }
    const toks = t.match(/[^\s,./()]+/g) || [];
    toks.forEach((x,i)=>{ add(w,'w:'+x); if(i) add(w,'w:'+toks[i-1]+' '+x); });
    return { c, w, v: vendor ? 'v:'+vendor : null };
  },
  scores(text, vendor){
    const M = this.m, z = Float64Array.from(M.bias), F = this.feats(text, vendor);
    for (const grp of [F.c, F.w]) {
      let ss = 0; const vals = [];
      for (const [k,cnt] of grp) { const e = M.feat[k]; if (!e) continue; const x=(1+Math.log(cnt))*e[0]; vals.push([e,x]); ss+=x*x; }
      const nrm = Math.sqrt(ss) || 1;   // 학습 어휘에 있는 n-gram 기준 L2 정규화 (sklearn과 동일)
      for (const [e,x] of vals) for (let i=1;i<e.length;i++) z[e[i][0]] += e[i][1] * x / nrm;
    }
    if (F.v && M.feat[F.v]) { const e=M.feat[F.v]; for (let i=1;i<e.length;i++) z[e[i][0]] += e[i][1]; }
    return z;
  },
  predict(text, { vendor, big, allowed, memo } = {}){
    if (!this.m || !clean(text)) return [];
    const z = this.scores(text, vendor); const L = this.m.labels;
    let mx = -Infinity; const keep = [];
    for (let k=0;k<L.length;k++) {
      const lab = L[k]; const p = lab.split(' > ');
      if (big && p[0] !== big) continue;
      if (allowed && !allowed.has(lab)) continue;
      keep.push(k); if (z[k] > mx) mx = z[k];
    }
    let sum = 0; const out = keep.map(k => { const e = Math.exp(z[k]-mx); sum += e; return { label: L[k], p: e }; });
    out.forEach(o => o.p /= (sum||1));
    // 관리대장에 똑같은 문구가 있으면 그 분류를 우선
    const hist = memo && memo.get(key(text));
    if (hist) { const tot = Object.values(hist).reduce((a,b)=>a+b,0);
      for (const [lab,n] of Object.entries(hist)) { if ((big && !lab.startsWith(big+' > ')) || (allowed && !allowed.has(lab))) continue;
        let o = out.find(x=>x.label===lab); if (!o) { o={label:lab,p:0}; out.push(o); }
        o.p = 0.5*o.p + 0.5*(n/tot); o.hist = n; } }
    return out.sort((a,b)=>b.p-a.p).slice(0,3).map(o=>({ ...o, parts:o.label.split(' > ') }));
  }
};

/* ================== 메시지 해석 ================== */
const NUM = /^\s*(?:\(?\d{1,2}\s*[.)\]]|[①-⑳]|[-*•·▶>])\s*/;
const QTY = /(\d+)\s*(?:EA|ea|Ea|개|pcs|PCS|SET|set|세트)\b/;
const PO_RE = /\bPO[-_][A-Z0-9][A-Z0-9_-]*/i;
const KW  = s => /EFEM/i.test(s) ? 'EFEM' : /PROCESS|프로세스/i.test(s) ? 'PROCESS' : '';

function findProject(line){
  const L = key(line); let best = null;
  for (const p of S.proj) {
    if (p.k.length < 3) continue;
    const i = L.indexOf(p.k); if (i < 0) continue;
    const nx = L[i + p.k.length] || '';
    if (/[0-9]/.test(nx) && /[0-9]$/.test(p.k)) continue;  // CC04-15 ↔ CC04-157 혼동 방지
    if (!best || p.k.length > best.k.length) best = p;
  }
  if (best) return { name: best.name, raw: best.name };
  const m = line.match(/\b([A-Z]{2,5}\d{2,4}-\d{2,4}|ECP\d{3}(?:\s*#\d+)?|MISC-[A-Z0-9 ]+#\d+)\b/i);
  return m ? { name: m[1].toUpperCase(), raw: m[1], unknown: true } : null;
}
function projectType(name, kw){
  const k = key(name);
  let cands = S.proj.filter(p => p.k === k || p.k.startsWith(k));
  if (!cands.length) return { type:'', list:[] };
  let pick = cands[0];
  if (kw) pick = cands.find(p => key(p.name+p.type).includes(kw)) || pick;
  else pick = cands.find(p => p.k === k) || pick;
  let type = pick.type;
  if (kw && !type.toUpperCase().includes(kw)) type = type.replace(/\s*(EFEM|PROCESS)\s*$/i,'') + ' ' + kw;
  const list = [...new Set(cands.map(c=>c.type))];
  return { type, list };
}
function findParts(line){
  const out = [];
  const toks = line.match(/[A-Za-z0-9][A-Za-z0-9_\-().#]*[A-Za-z0-9)]/g) || [];
  for (let t of toks) {
    const k = key(t);
    if (S.parts.has(k)) { out.push({ ...S.parts.get(k), raw:t }); continue; }
    const k2 = k.replace(/[().]+$/,''); if (S.parts.has(k2)) { out.push({ ...S.parts.get(k2), raw:t }); continue; }
    // 등록 안 된 품번 모양 (영문/숫자 + 하이픈 2개 이상 또는 영문+숫자 혼합 8자 이상)
    if ((/^[A-Z0-9]+(-[A-Z0-9_]+){1,}$/i.test(t) && /\d/.test(t) && /[A-Z]/i.test(t)) && t.length >= 6) out.push({ pn:t, name:'', raw:t, unknown:true });
  }
  return out;
}
function parseMessage(text){
  const lines = text.replace(/\r/g,'').split('\n');
  const items = []; let cur = null, lastNum = 0;
  const fresh = (inherit) => ({ proj: inherit?.proj || null, kw: inherit?.kw || '', po: inherit?.po || '', part: null, qty: '', text: [] , raw:[] });
  const push = () => { if (cur && (cur.part || cur.text.length || cur.proj)) items.push(cur); };
  for (let raw of lines) {
    if (!raw.trim()) { if (cur && (cur.part || cur.text.length)) { push(); cur = null; } continue; }
    const nm = raw.match(/^\s*\(?(\d{1,2})\s*[.)\]]/); const num = nm ? +nm[1] : 0;
    let line = raw.replace(NUM,'').trim();
    if (!cur) cur = fresh(items[items.length-1]);
    if (num === 1 && lastNum >= 1 && (cur.part || cur.text.length)) { push(); cur = fresh(cur); }
    if (num) lastNum = num;
    // 프로젝트
    // PO 번호 (예: PO-2026-08-4311) → 장비타입 칸에 그대로 기입, 품번/발주명으로 오인하지 않게 먼저 떼어냄
    const po = line.match(PO_RE);
    if (po) {
      if (cur.po && cur.po !== po[0].toUpperCase() && (cur.part || cur.text.length)) { push(); cur = fresh(); }
      cur.po = po[0].toUpperCase(); line = removeOnce(line, po[0]);
    }
    const pj = findProject(line);
    if (pj) {
      if (cur.proj && cur.proj.name !== pj.name && (cur.part || cur.text.length)) { push(); cur = fresh(); }
      cur.proj = pj; line = removeOnce(line, pj.raw);
    }
    const kw = KW(raw); if (kw) { cur.kw = kw; if (/^\s*(EFEM|PROCESS|프로세스)\s*$/i.test(line)) line = ''; }
    // 품번
    for (const pt of findParts(line)) {
      if (cur.part && (cur.part.pn !== pt.pn)) { push(); cur = fresh(cur); }
      cur.part = pt; line = removeOnce(line, pt.raw);
    }
    // 수량
    const q = line.match(QTY); if (q) { cur.qty = q[1] + ' EA'; line = line.replace(QTY,''); }
    line = line.replace(/^[\s,/:|-]+|[\s,/:|-]+$/g,'').trim();
    if (/^수량\s*[:：]?$/.test(line)) line = '';
    if (line) cur.text.push(line);
  }
  push();
  return items;
}
function removeOnce(s, sub){ const i = s.toUpperCase().indexOf(String(sub).toUpperCase()); return i<0 ? s : (s.slice(0,i) + ' ' + s.slice(i+sub.length)).trim(); }

/* ================== 카드 생성 ================== */
function makeItem(p){
  const projName = p.proj?.name || '';
  const pt = projName ? projectType(projName, p.kw) : { type:'', list:[] };
  const it = {
    date: today(), proj: projName, type: p.po || pt.type, types: p.po ? [] : pt.list, po: p.po || '', projUnknown: !p.po && (!!p.proj?.unknown || (projName && !pt.type)),
    finder: store.get('nc_finder',''), name: fmtName(p.part?.name), pn: p.part?.pn || '', partUnknown: !!p.part?.unknown,
    qty: p.qty || '1 EA', b:'', m:'', s:'', when:'공정', text: p.text.join(' / '), act:'', vendor:'', ps:'',
    recs: [], manual:false
  };
  recommend(it, true);
  return it;
}
function recommend(it, apply){
  const big = it.vendor ? S.vendorBig[it.vendor] : (it.manualBig ? it.b : null);
  it.recs = Model.predict(it.text, { vendor: it.vendor || null, big, allowed: S.allowed?.size ? S.allowed : null, memo: S.memo });
  if (apply && !it.manual && it.recs[0]) [it.b, it.m, it.s] = it.recs[0].parts;
  else if (big && it.b !== big) { it.b = big; it.m = ''; it.s = ''; if (it.recs[0] && !it.manual) [it.b,it.m,it.s] = it.recs[0].parts; }
}
function formatText(it){

}
// 품명 표기: 영문은 대문자, 프레임/FRAME이 들어가면 '-'
const fmtName = n => { n = clean(n); if (!n) return ''; if (/프레임|FRAME/i.test(n)) return '-'; return n.toUpperCase(); };
const ko = (a,b) => String(a).localeCompare(String(b),'ko');
// 가나다순 정렬 + 빈 선택지 없음 (값이 없을 때만 숨김 안내 문구)
const opt = (arr, v, color, order) => (v && arr.includes(v) ? [] : ['<option value="" disabled selected hidden>선택</option>'])
    .concat([...new Set(arr)].sort(order ? ((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || ko(a,b); }) : ko).map(x=>`<option${x===v?' selected':''}${color?` style="background:${color(x)}"`:''}>${esc(x)}</option>`)).join('');
const bigColor = b => CONFIG.BIG_COLORS[b] || '';
function confCls(p){ return p>=0.7?'h':p>=0.4?'m':'l'; }
function renderCard(it, i){

        ${f('발견자', `<div class="combo"><input data-k="finder" data-combo="finder" value="${esc(it.finder)}" placeholder="이름 · 초성 검색 (예: ㄱㅅㅂ)" autocomplete="off"><div class="dd"></div></div>`)}

        ${chips?`<div class="chips">${chips}</div>`:''}

        ${f('불량내용', inp('text'))}

        ${f('P.S', inp('ps'))}
      </div>
      <div class="out"><pre data-out>${esc(formatText(it))}</pre></div>
    </div></div>`;

/* ================== 귀책 검색 (초성 지원) ================== */
function vendorMatches(q, big){
  const list = S.vendors.length ? S.vendors : [];
  const qq = clean(q).toLowerCase(), qc = choseong(qq);
  const score = v => { const n=v.name.toLowerCase(), c=choseong(n);
    if (!qq) return 1; if (n.startsWith(qq)) return 4; if (n.includes(qq)) return 3; if (c.startsWith(qc)) return 2; if (c.includes(qc)) return 1; return 0; };
  return list.map(v=>({v,s:score(v)+(big&&v.big===big?0.5:0)})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s || ko(a.v.name,b.v.name)).slice(0,30).map(x=>x.v);
}
function nameMatches(q, names){
  const qq = clean(q).toLowerCase(), qc = choseong(qq);
  const score = n => { const l=n.toLowerCase(), c=choseong(l);
    if (!qq) return 1; if (l.startsWith(qq)) return 4; if (l.includes(qq)) return 3; if (c.startsWith(qc)) return 2; if (c.includes(qc)) return 1; return 0; };
  return names.map(n=>({n,s:score(n)})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s || ko(a.n,b.n)).slice(0,30).map(x=>x.n);
}
function openDD(input){
  const card = input.closest('.card'), it = S.items[+card.dataset.i], dd = input.nextElementSibling;
  if (input.dataset.combo === 'finder') {
    const list = nameMatches(input.value, S.finders);
    dd.innerHTML = list.map((n,j)=>`<div data-v="${esc(n)}" class="${j===0?'act':''}">${esc(n)}</div>`).join('') || '<div><small>명단에 없음 — 그대로 입력돼요</small></div>';
  } else {
    const list = vendorMatches(input.value, it.b);
    dd.innerHTML = list.map((v,j)=>`<div data-v="${esc(v.name)}" class="${j===0?'act':''}">${esc(v.name)}<small>${esc(v.big)}</small></div>`).join('') || '<div><small>결과 없음</small></div>';
  }
  dd.style.display = 'block';
}
function pickFinder(i, name){ const it = S.items[i]; it.finder = name; store.set('nc_finder', name); S.items.forEach((x,j)=>{ if (j!==i && !x.finder) x.finder = name; }); rerender(); }
function pickCombo(el, name){ const i = +el.closest('.card').dataset.i; return el.dataset.combo === 'finder' ? pickFinder(i, name) : pickVendor(i, name); }
function pickVendor(i, name){
  const it = S.items[i]; it.vendor = name; it.manual = false; recommend(it, true); refreshCard(i);
}

/* ================== 이벤트 ================== */
$('#go').onclick = run;
$('#clear').onclick = () => { $('#src').value=''; S.items=[]; rerender(); $('#src').focus(); };
$('#src').addEventListener('keydown', e => { if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); run(); } });
$('#src').addEventListener('paste', () => setTimeout(run, 0));


async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('복사했어요');
}
$('#copyall').onclick = () => copy(S.items.map(formatText).join('\n\n'));

const cards = $('#cards');
cards.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return; const i = +card.dataset.i, it = S.items[i];
  if (e.target.closest('[data-copy]')) return copy(formatText(it));
  if (e.target.closest('[data-del]')) { S.items.splice(i,1); return rerender(); }
  const wh = e.target.closest('[data-when]');
  if (wh) { it.when = wh.dataset.when; return refreshCard(i); }
  const ac = e.target.closest('[data-actv]');
  if (ac) { it.act = it.act === ac.dataset.actv ? '' : ac.dataset.actv; return refreshCard(i); }   // 다시 누르면 해제
  const chip = e.target.closest('[data-rec]');
  if (chip) { [it.b,it.m,it.s] = it.recs[+chip.dataset.rec].parts; it.manual = true; return refreshCard(i); }
  const dv = e.target.closest('.dd [data-v]'); if (dv) return pickCombo(dv.closest('.combo').querySelector('input'), dv.dataset.v);
});
cards.addEventListener('input', e => {
  const el = e.target, card = el.closest('.card'); if (!card || !el.dataset.k) return;
  const i = +card.dataset.i, it = S.items[i], k = el.dataset.k;
  it[k] = el.value;
  if (k==='name') el.classList.toggle('need', !clean(el.value));
  if (k==='finder') { store.set('nc_finder', el.value); openDD(el); }
  if (k==='vendor') { openDD(el); if (S.vendorBig[el.value]) { /* 정확히 일치하면 바로 적용은 blur 시 */ } }
  if (k==='text') { it.recs = Model.predict(it.text, { vendor: it.vendor||null, big: it.vendor?S.vendorBig[it.vendor]:null, allowed:S.allowed, memo:S.memo }); }
  refreshOut(i);
});
cards.addEventListener('change', e => {
  const el = e.target, card = el.closest('.card'); if (!card || !el.dataset.k) return;
  const i = +card.dataset.i, it = S.items[i], k = el.dataset.k;
  if (k==='b') { it.b = el.value; it.m=''; it.s=''; it.manual = true; it.manualBig = true;
    if (it.vendor && S.vendorBig[it.vendor] && S.vendorBig[it.vendor] !== it.b) it.vendor = '';
    const r = Model.predict(it.text, { big: it.b, allowed:S.allowed, memo:S.memo }); if (r[0]) [,it.m,it.s] = r[0].parts; it.recs = r; return refreshCard(i); }
  if (k==='m') { it.m = el.value; it.s=''; it.manual = true; const r = it.recs.find(x=>x.parts[0]===it.b && x.parts[1]===it.m); if (r) it.s = r.parts[2]; return refreshCard(i); }
  if (k==='s') { it.s = el.value; it.manual = true; return refreshCard(i); }
  if (k==='text') { if (!it.manual) recommend(it, true); return refreshCard(i); }
  if (k==='proj') { const pj = findProject(it.proj); const pt = projectType(pj?.name || it.proj, KW(it.proj) || ''); it.type = pt.type || it.type; it.types = pt.list; it.projUnknown = !pt.type; return refreshCard(i); }
  if (k==='pn') { const p = S.parts.get(key(it.pn)); if (p) { it.name = fmtName(p.name); it.partUnknown = false; } return refreshCard(i); }
  refreshOut(i);
});
cards.addEventListener('keydown', e => {
  const el = e.target; if (!el.hasAttribute('data-combo')) return;
  const dd = el.nextElementSibling, items = [...dd.querySelectorAll('[data-v]')]; let a = items.findIndex(x=>x.classList.contains('act'));
  if (e.key==='ArrowDown'||e.key==='ArrowUp') { e.preventDefault(); if(!items.length) return; items[a]?.classList.remove('act'); a = (a + (e.key==='ArrowDown'?1:-1) + items.length) % items.length; items[a].classList.add('act'); items[a].scrollIntoView({block:'nearest'}); }
  if (e.key==='Enter') { e.preventDefault(); const pick = items[a] || items[0]; if (pick) pickCombo(el, pick.dataset.v); }
  if (e.key==='Escape') dd.style.display='none';
});
cards.addEventListener('focusin', e => { if (e.target.hasAttribute('data-combo')) openDD(e.target); });
document.addEventListener('mousedown', e => { if (!e.target.closest('.combo')) document.querySelectorAll('.dd').forEach(d=>d.style.display='none'); });
cards.addEventListener('focusout', e => {
  const el = e.target; if (!el.hasAttribute('data-combo')) return;
  setTimeout(() => { const card = el.closest('.card'); if (!card || card.contains(document.activeElement) && document.activeElement===el) return;
    const i = +card.dataset.i, it = S.items[i];
    if (el.dataset.combo !== 'vendor') return;
    if (S.vendorBig[it.vendor] && S.vendorBig[it.vendor] !== it.b) pickVendor(i, it.vendor); }, 150);
});

rerender();
loadAll();
</script>
</body>
</html>
